spring.application.name=taller-formularios
spring.profiles.active=dev
server.error.whitelabel.enabled=false

# Puerto: Render entrega el suyo en la variable PORT; en tu computadora no existe y se usa 8080.
server.port=${PORT:8080}

# Contraseñas iniciales: NO están escritas aquí. Se leen de variables de entorno.
app.admin.password=${ADMIN_PASSWORD}
app.entrenador.password=${ENTRENADOR_PASSWORD}
# SEMANA 16: clave del usuario de prueba con rol JUGADOR. Opcional: si no existe la variable, queda vacia y no se crea el usuario.
app.jugador.password=${JUGADOR_PASSWORD:}
